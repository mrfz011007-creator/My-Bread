name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: Verify unit test results
        if: success()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report_dir = Path("app/build/test-results/testDebugUnitTest")
          reports = sorted(report_dir.glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("ERROR: Gradle produced no JUnit XML test reports.")

          tests = failures = errors = skipped = 0
          for report in reports:
              root = ET.parse(report).getroot()
              tests += int(root.attrib.get("tests", "0"))
              failures += int(root.attrib.get("failures", "0"))
              errors += int(root.attrib.get("errors", "0"))
              skipped += int(root.attrib.get("skipped", "0"))

          print(f"JUnit results: {tests} tests, {failures} failures, {errors} errors, {skipped} skipped.")
          if tests == 0:
              raise SystemExit("ERROR: No unit tests were executed.")
          if failures or errors:
              raise SystemExit("ERROR: Unit tests failed.")
          PY

      - name: Build debug APK
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: Verify debug APK contents
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'classes.dex'

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: My-Bread-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
